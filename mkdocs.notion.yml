site_name: Caffreyfans 技术文档
site_url: https://caffreyfans.github.io/notion/
docs_dir: .notion-build/docs
site_dir: .notion-build/site
theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.expand
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang:
        - en
        - zh
markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true
